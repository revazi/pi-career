name: Bug report
description: Report a reproducible pi-career package or runtime defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Use synthetic or redacted data only. Do not include resume or job text, credentials, Pi session data, executable paths, environment values, or raw diagnostics.
  - type: input
    id: revision
    attributes:
      label: pi-career revision or install source
      description: Provide a reviewed commit SHA or local package revision without credentials.
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: Pi version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform and Node version
      description: For example, darwin arm64 with Node 22.19.0 or Linux x64 GNU with Node 22.19.0.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Safe reproduction
      description: Provide bounded steps using synthetic inputs. Do not paste private documents or raw process output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Use stable error codes and sanitized summaries only.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private career content, credentials, session data, paths, environment values, and raw diagnostics.
          required: true
