name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  adapter:
    name: Adapter checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      PI_TELEMETRY: "0"
      PI_SKIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          architecture: x64
          cache: npm
      - name: Verify exact Node host
        shell: node {0}
        run: |
          const glibc = process.report.getReport()?.header?.glibcVersionRuntime;
          if (
            process.version !== "v22.19.0" ||
            process.platform !== "linux" ||
            process.arch !== "x64" ||
            typeof glibc !== "string" ||
            glibc.length === 0
          ) {
            throw new Error("Node host does not match the reviewed adapter-check target");
          }
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- dist/index.js dist/pdf-worker.js
      - run: npm run bench:tokens
      - run: npm run check
      - run: npm run check:package
      - run: npm run test:pi-smoke
        env:
          PI_OFFLINE: "1"
      - run: npm run test:install
        env:
          PI_OFFLINE: "1"
      - run: npm ls --omit=dev --depth=0
      - run: git diff --check
