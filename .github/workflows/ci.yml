name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native runtime (${{ matrix.runtime_target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            runtime_target: linux-x64-gnu
          - runner: macos-14
            runtime_target: darwin-arm64
    env:
      EXPECTED_RUNTIME_TARGET: ${{ matrix.runtime_target }}
      PI_OFFLINE: "1"
      PI_TELEMETRY: "0"
      PI_SKIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code -- dist/index.js
      - run: npm run check
      - run: npm run test:bundled-runtime
      - run: npm run check:package
      - run: npm run audit:runtime
      - run: npm run test:pi-smoke
      - run: npm run test:install
      - run: git diff --check
