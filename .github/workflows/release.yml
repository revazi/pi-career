name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish npm package
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    environment: npm
    permissions:
      actions: read
      checks: read
      contents: write
      id-token: write
    env:
      PI_TELEMETRY: "0"
      PI_SKIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup exact Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          architecture: x64

      - name: Verify release tag, candidate, and host
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_SHA="$(git rev-parse HEAD)"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "v$RELEASE_VERSION"
          test "$GITHUB_REF" = "refs/tags/$GITHUB_REF_NAME"
          test "$GITHUB_SHA" = "$RELEASE_SHA"
          test "$(git cat-file -t "$GITHUB_REF")" = "tag"
          test "$(git rev-parse "$GITHUB_REF^{}")" = "$RELEASE_SHA"
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$RELEASE_SHA"
          if git cat-file tag "$GITHUB_REF" | grep -q '^gpgsig '; then
            echo "release tag must be annotated and unsigned" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          grep -Eq "^## $RELEASE_VERSION - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md
          test "$(node -p "require('./package-lock.json').version")" = "$RELEASE_VERSION"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "$RELEASE_VERSION"
          test -z "$(git status --porcelain --untracked-files=no)"
          node <<'NODE'
          const glibc = process.report.getReport()?.header?.glibcVersionRuntime;
          if (
            process.version !== "v22.19.0" ||
            process.platform !== "linux" ||
            process.arch !== "x64" ||
            typeof glibc !== "string" ||
            glibc.length === 0
          ) throw new Error("release host does not match the reviewed target");
          NODE
          {
            echo "RELEASE_VERSION=$RELEASE_VERSION"
            echo "RELEASE_TAG=$GITHUB_REF_NAME"
            echo "RELEASE_SHA=$RELEASE_SHA"
          } >> "$GITHUB_ENV"

      - name: Install exact trusted-publishing npm
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${NPM_TOKEN+x}" || -n "${NODE_AUTH_TOKEN+x}" ]]; then
            echo "long-lived npm publication credentials are forbidden" >&2
            exit 1
          fi
          npm install --global --ignore-scripts --registry=https://registry.npmjs.org/ npm@11.6.2
          test "$(npm --version)" = "11.6.2"

      - name: Verify same-commit hosted gates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: node {0}
        run: |
          import assert from "node:assert/strict";
          import { parseStrictJson } from "./scripts/lib/strict-json.mjs";
          const headers = {
            accept: "application/vnd.github+json",
            authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
            "user-agent": "pi-career-release/0.2.0",
            "x-github-api-version": "2022-11-28",
          };
          async function github(path) {
            const response = await fetch(`https://api.github.com${path}`, {
              headers,
              redirect: "error",
              signal: AbortSignal.timeout(30_000),
            });
            assert.equal(response.status, 200, `GitHub gate query failed for ${path}`);
            const text = await response.text();
            return parseStrictJson(text, { label: "GitHub gate response", maximumBytes: 2 * 1024 * 1024 });
          }
          const sha = process.env.RELEASE_SHA;
          const checks = await github(`/repos/revazi/pi-career/commits/${sha}/check-runs?per_page=100`);
          assert.ok(
            checks.check_runs.some(({ name, status, conclusion }) =>
              name === "Adapter checks" && status === "completed" && conclusion === "success"),
            "same-commit Adapter checks must pass",
          );
          const runs = await github(
            `/repos/revazi/pi-career/actions/workflows/external-career.yml/runs?event=workflow_dispatch&status=success&head_sha=${sha}&per_page=20`,
          );
          assert.ok(
            runs.workflow_runs.some(({ head_sha, event, status, conclusion }) =>
              head_sha === sha && event === "workflow_dispatch" && status === "completed" && conclusion === "success"),
            "same-commit External Career Compatibility must pass",
          );
          process.stdout.write("Verified same-commit Adapter checks and six-target External Career Compatibility\n");

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run complete release gate
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          git diff --exit-code -- dist/index.js dist/pdf-worker.js
          npm run bench:tokens
          npm run check
          npm run test:runtime-resolution
          npm run test:career-package
          npm run audit:production
          npm run audit:full
          npm run check:publish
          PI_OFFLINE=1 npm run test:pi-smoke
          PI_OFFLINE=1 npm run test:install
          npm run test:compat
          npm ls --omit=dev --depth=0
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Confirm immutable npm version is absent
        run: node scripts/verify-release-registry.mjs absent

      - name: Publish exact package through OIDC with provenance
        run: npm publish --access public --tag latest --provenance --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Verify authoritative npm registry state
        id: registry
        run: node scripts/verify-release-registry.mjs published

      - name: Create verified GitHub Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_INTEGRITY: ${{ steps.registry.outputs.integrity }}
          RELEASE_SHASUM: ${{ steps.registry.outputs.shasum }}
        run: node scripts/create-github-release.mjs
